<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Light app background so the browser chrome (Safari address bar / Android
         status bar) and the installed-PWA status bar all sit in the same airy
         light key as the UI instead of a saturated blue band. With the 'default'
         iOS status-bar style below, iOS paints an OPAQUE bar in roughly this
         tone above the web view, so the status strip matches the light app
         background rather than showing a grey/blue band. -->
    <meta name="theme-color" content="#f2f3f7" />
    <title>CityMate</title>
    <meta name="description" content="CityMate — your local friend in a new city." />
    <!-- PWA: home-screen icon + iOS standalone hints (Stage 11C). The manifest
         link + service-worker registration are injected by vite-plugin-pwa. -->
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 'default' iOS status bar: iOS reserves an OPAQUE light bar (in the
         theme-color tone above) at the top and lays the web content BELOW it,
         with DARK glyphs (clock / battery). We chose this over black-translucent
         because translucent forced WHITE glyphs app-wide, and on the four light
         screens (Catalog, Favourites, Profile, Chat) the clock became nearly
         invisible — readable time on the majority of screens wins. Because the
         status bar is now opaque, content no longer flows under it, so
         env(safe-area-inset-top) collapses to ~0 in standalone mode and the
         top offsets in global.css (.app-shell / .home__hero / .welcome) simply
         revert to their base spacing; they stay for browser / Android / landscape
         robustness. On Home the Alanya photo therefore stops just under the light
         status strip (expected — as it was before the recent status-bar work). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CityMate" />
    <!-- App typography (all must cover the 13 start languages — Cyrillic + Latin
         Extended — so nothing renders as tofu):
         · Manrope  — UI + body sans (Latin, Latin Extended, Cyrillic).
         · Cormorant Garamond — elegant serif for headings / "soulful" bits.
           It has no Cyrillic, so EB Garamond (same Garamond lineage, full
           Cyrillic) follows in the --font-serif stack and the browser fills
           ru/uk glyphs from it per-glyph — see src/styles/global.css.
         · EB Garamond — Cyrillic-capable Garamond fallback for the serif.
         · Caveat — handwriting display, used only for the welcome greeting. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
