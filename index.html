<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Light app background so the browser chrome (Safari address bar / Android
         status bar when NOT installed as a standalone app) matches the airy light
         UI instead of a saturated blue band. Inside an installed iOS PWA this is
         ignored — the status bar there is controlled by the black-translucent
         style below (transparent, content flows under it). -->
    <meta name="theme-color" content="#f2f3f7" />
    <title>CityMate</title>
    <meta name="description" content="CityMate — your local friend in a new city." />
    <!-- PWA: home-screen icon + iOS standalone hints (Stage 11C). The manifest
         link + service-worker registration are injected by vite-plugin-pwa. -->
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Transparent iOS status bar: the web content flows UP under the clock /
         battery / notch band instead of iOS painting an opaque grey strip there
         (which no CSS background could recolour). Every screen now fills that
         band itself — ivory on Catalog, the Alanya photo on Home, etc. — so the
         grey bar is gone app-wide. The top offset needed so headings don't slide
         under the clock is added via env(safe-area-inset-top) in global.css
         (.app-shell + .home__hero). NOTE: black-translucent forces LIGHT (white)
         status-bar glyphs on iOS with no per-screen dark variant — see the
         readability caveat noted to the owner. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CityMate" />
    <!-- App typography (all must cover the 13 start languages — Cyrillic + Latin
         Extended — so nothing renders as tofu):
         · Manrope  — UI + body sans (Latin, Latin Extended, Cyrillic).
         · Cormorant Garamond — elegant serif for headings / "soulful" bits.
           It has no Cyrillic, so EB Garamond (same Garamond lineage, full
           Cyrillic) follows in the --font-serif stack and the browser fills
           ru/uk glyphs from it per-glyph — see src/styles/global.css.
         · EB Garamond — Cyrillic-capable Garamond fallback for the serif.
         · Caveat — handwriting display, used only for the welcome greeting. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
